  assemblies:
  - SistemaMatricula
  namespace: SistemaMatricula
  summary: >-
    Calcula el costo total de los cursos a matricular.

    Este método es 'virtual' para permitir que clases hijas (como EstudianteBecado) 

    lo modifiquen, abriendo paso al concepto de Polimorfismo.
  example: []
  syntax:
    content: public virtual double CalcularPagoMatricula(int creditos)
    parameters:
    - id: creditos
      type: System.Int32
      description: Cantidad total de créditos a llevar en el semestre.
    return:
      type: System.Double
      description: Costo base de la matrícula.
